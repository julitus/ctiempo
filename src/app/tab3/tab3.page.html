<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="content-div">
    <ion-list>
      <ion-item>
        <ion-label position="floating">{{ 'TAB3.date_start' | translate }}</ion-label>
        <ion-datetime displayFormat="DD-MM-YYYY" [(ngModel)]="start" cancelText="{{ 'TAB3.select_date_cancel' | translate }}" doneText="{{ 'TAB3.select_date_done' | translate }}"></ion-datetime>
      </ion-item>
      <ion-item>
        <ion-label position="floating">{{ 'TAB3.date_end' | translate }}</ion-label>
        <ion-datetime displayFormat="DD-MM-YYYY" [(ngModel)]="end" cancelText="{{ 'TAB3.select_date_cancel' | translate }}" doneText="{{ 'TAB3.select_date_done' | translate }}"></ion-datetime>
      </ion-item>
      <ion-button expand="full" fill="outline" (click)="search()">{{ 'TAB3.search' | translate }}</ion-button>
    </ion-list>

    <div>
      <ion-card>
        <ion-card-header>
          {{ 'TAB3.bar_title' | translate }}
        </ion-card-header>
        <ion-card-content>
          <canvas #barCanvas></canvas>
        </ion-card-content>
      </ion-card>

      <ion-card>
        <ion-card-header>
          {{ 'TAB3.bar_horizontal_title' | translate }}
        </ion-card-header>
        <ion-card-content>
          <canvas #barHorizontalCanvas></canvas>
        </ion-card-content>
      </ion-card>
    </div>

  </div>

</ion-content>
